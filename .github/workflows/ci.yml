name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type-check, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --ext .ts,.tsx

      - name: Unit tests
        run: npm test -- --ci --coverage=false

  # The Maestro E2E suite is not wired up here yet. The decision to run it in CI
  # — on an Android emulator on ubuntu-latest, not a macOS runner — is recorded
  # in docs/decisions.md (2026-08-01) and gated on every flow passing first.
  # See #190. The job invocation is `maestro test maestro/`, which picks up
  # maestro/config.yaml.
