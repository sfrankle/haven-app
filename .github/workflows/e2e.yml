# Maestro E2E suite. Manual only — this is a once-per-milestone regression run,
# not a per-PR gate. Building the APK and booting an emulator takes ~25 minutes,
# which is too slow to sit in front of every PR.
#
# The APK is a release build (EAS `preview` profile), so the JS bundle is baked
# in and no Metro server is needed — unlike the local debug build, where every
# flow dies at step 1 on "Unable to load script" without `expo start`.
#
# Decision recorded in docs/decisions.md (2026-08-01). See #190.
name: E2E

on:
  workflow_dispatch:
    inputs:
      flows:
        description: 'Flow path to run, relative to the repo root. Defaults to the whole suite.'
        required: false
        default: 'maestro/'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Maestro flows
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build APK (local)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --local --platform android --profile preview --non-interactive --output ./haven.apk

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # KVM is not enabled by default on ubuntu-latest, and the emulator is
      # unusably slow without hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r ./haven.apk
            maestro test ${{ inputs.flows }}

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: ~/.maestro/tests/
          if-no-files-found: ignore
