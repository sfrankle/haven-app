appId: com.haven.app
# Precondition: app has at least one Focus (e.g. created via create-focus.yaml)
# and at least one entry associated with that Focus.
# This flow tests active focuses only; archived focuses are listed after active
# ones in the filter row but are not exercised here.
---
- launchApp

# Navigate to Trace tab
- tapOn:
    id: "tab-trace"

# Assert the focus filter row is visible (only shown when focuses exist)
- assertVisible:
    id: "focus-filter-row"

# Tap the first focus pill (active, unselected)
- tapOn:
    id: "focus-pill-1"

# Assert the pill is now selected
- assertVisible:
    id: "focus-pill-selected-1"

# Assert at least the entry list area is visible (filter applied)
- assertVisible:
    id: "focus-filter-row"

# Tap the selected pill again to deselect (toggle off)
- tapOn:
    id: "focus-pill-selected-1"

# Assert the pill is back to unselected state
- assertVisible:
    id: "focus-pill-1"
