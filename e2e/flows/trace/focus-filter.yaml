appId: com.haven.app
# Precondition: app has at least one Focus (e.g. created via create-focus.yaml)
# and at least one entry associated with that Focus.
# This flow tests active focuses only; archived focuses are listed after active
# ones in the filter row but are not exercised here.
---
- launchApp

# Navigate to Trace tab
- tapOn:
    id: "tab-trace"

# Assert the focus filter row is visible (only shown when focuses exist)
- assertVisible:
    id: "focus-filter-row"

# Tap the first focus pill to activate the filter
- tapOn:
    id: "focus-pill-1"

# Assert the pill is still present (stable testID regardless of selection state)
- assertVisible:
    id: "focus-pill-1"

# Assert the filter row is still visible
- assertVisible:
    id: "focus-filter-row"

# Tap the pill again to deselect (toggle off)
- tapOn:
    id: "focus-pill-1"

# Assert the pill is still present (unfiltered view restored)
- assertVisible:
    id: "focus-pill-1"

# --- Tab re-tap resets filter (item 6) ---
# Activate the filter again
- tapOn:
    id: "focus-pill-1"

# Tap the Trace tab again while already on Trace — filter should reset
- tapOn:
    id: "tab-trace"

# The pill should be present but no longer selected (filter reset)
- assertVisible:
    id: "focus-pill-1"
