appId: com.haven.app
---
# clearState is required: add-focus-pill renders after every existing focus
# pill in a horizontal ScrollView, so focuses left behind by an earlier flow
# push it off-screen and it can no longer be tapped.
- launchApp:
    clearState: true

# Ensure Tend tab is visible
- assertVisible:
    id: "tile-food"

# Create a focus first so we have something to edit
- tapOn:
    id: "add-focus-pill"
- assertVisible:
    id: "focus-name-input"
- tapOn:
    id: "focus-name-input"
- inputText: "Edit Me"
- tapOn:
    id: "focus-save-button"
- assertVisible:
    text: "Edit Me"

# Long-press the focus pill to open edit screen
- longPressOn:
    text: "Edit Me"

# Assert edit screen is shown
- assertVisible:
    id: "focus-edit-name-input"

# Clear name and type a new one
- tapOn:
    id: "focus-edit-name-input"
- eraseText
- inputText: "Renamed Focus"
- hideKeyboard

# Tap save
- tapOn:
    id: "focus-edit-save-button"

# Assert returned to Tend with new name visible
- assertVisible:
    id: "add-focus-pill"
- assertVisible:
    text: "Renamed Focus"
