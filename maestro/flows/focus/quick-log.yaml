appId: com.haven.app
---
# clearState is required: add-focus-pill renders after every existing focus
# pill in a horizontal ScrollView, so focuses left behind by an earlier flow
# push it off-screen and it can no longer be tapped.
- launchApp:
    clearState: true

# Assert Tend tab is visible
- assertVisible:
    id: "tile-food"

# Create a Focus with a pinned label so the quick-log screen has items.
# Step 1: Create the Focus via the + Add Focus pill
- tapOn:
    id: "add-focus-pill"

- assertVisible:
    id: "focus-name-input"

- tapOn:
    id: "focus-name-input"
- inputText: "Quick Log Test"

- tapOn:
    id: "focus-save-button"

# Assert named pill now appears on Tend
- assertVisible:
    text: "Quick Log Test"

# Step 2: Long-press the pill to open the edit screen and pin labels
- longPressOn:
    text: "Quick Log Test"

# Search for and pin a Food label (e.g. "Apple").
# Target the suggestion by testID, not by its display text: the search field
# itself contains the same text once typed, so `text: "Apple"` at index 0
# matches the input and the tap silently does nothing.
- tapOn:
    id: "focus-edit-label-search"
- inputText: "Apple"

- assertVisible:
    id: "focus-edit-suggestion-.*"
# This screen's ScrollView does not set keyboardShouldPersistTaps, so the first
# tap while the keyboard is up is consumed dismissing it and never reaches the
# suggestion. Dismiss it explicitly first — the keyboard is up here, so
# hideKeyboard closes it rather than popping the screen. See #195.
- hideKeyboard
- tapOn:
    id: "focus-edit-suggestion-.*"

# Also pin a Physical label so we can test severity 0 in quick-log
- tapOn:
    id: "focus-edit-label-search"
- eraseText
- inputText: "Cramp"

- assertVisible:
    id: "focus-edit-suggestion-.*"
- hideKeyboard
- tapOn:
    id: "focus-edit-suggestion-.*"

# No hideKeyboard here. Tapping a suggestion chip already dismisses the
# keyboard, and Maestro implements hideKeyboard on Android as a back press —
# with the keyboard already down it pops the screen instead, landing on Tend
# before the save ever happens.
- tapOn:
    id: "focus-edit-save-button"

# Back on Tend — tap the Focus pill to open the quick-log screen
- tapOn:
    text: "Quick Log Test"

# Assert quick-log screen is visible with at least one item row
- assertVisible:
    id: "section-heading-pinned"

- assertVisible:
    id: "submit-button"

# The Physical item (Cramp) should show a severity row including button 0
# SeverityRow renders with accessibility labels — assert the "0 — absent" button
- assertVisible:
    text: "0"

# Tap Submit to log all items
- tapOn:
    id: "submit-button"

# Assert navigated back to Tend
- assertVisible:
    id: "tile-food"

# Navigate to Trace and assert the logged entries actually landed. There is no
# "trace-screen" testID; asserting a real entry row is a stronger check anyway,
# since it proves the quick-log submission persisted rather than just that the
# tab rendered.
- tapOn:
    id: "tab-trace"

- assertVisible:
    id: "trace-row-icon-.*"
