appId: com.haven.app
---
# Scenario: open a log screen, swipe back, switch tabs, swipe back again
# Expected: never returns to a log screen after it has been dismissed
- launchApp
- assertVisible: "Replenish"        # on Tend home

- tapOn: "Replenish"
- assertVisible: "How much water did you take in?"

- back                              # swipe back to Tend
- assertVisible: "Replenish"        # tile visible — on Tend home

- tapOn: "Trace"
- assertVisible: "Trace"

- back                              # should stay on Tend, not return to log screen
- assertVisible: "Replenish"        # tile visible — on Tend home, NOT on log screen

---
# Scenario: tap Tend tab while on a log screen returns to Tend home
- launchApp
- assertVisible: "Replenish"

- tapOn: "Replenish"
- assertVisible: "How much water did you take in?"

- tapOn: "Tend"
- assertVisible: "Replenish"        # tile visible — on Tend home
- assertNotVisible: "How much water did you take in?"

---
# Scenario: sequential multi-type log — open A, back, open B, back; land on Tend each time
- launchApp
- assertVisible: "Replenish"

- tapOn: "Replenish"
- assertVisible: "How much water did you take in?"

- back
- assertVisible: "Replenish"        # on Tend home after first back

- tapOn: "Journey"
- assertVisible: "What did you do today?"

- back
- assertVisible: "Journey"          # on Tend home after second back
- assertNotVisible: "What did you do today?"

---
# Scenario: navigating back without saving resets form state on re-entry
- launchApp
- assertVisible: "Replenish"

- tapOn: "Replenish"
- assertVisible: "How much water did you take in?"

- tapOn:
    id: "hydration-oz-input"
- eraseText
- inputText: "32"

- back
- assertVisible: "Replenish"        # on Tend home

- tapOn: "Replenish"
- assertVisible: "How much water did you take in?"
- assertVisible: "16"               # input reset to default — no cached state from prior visit
