# Scenario: open a log screen, swipe back, switch tabs, swipe back again
# Expected: never returns to a log screen after it has been dismissed
#
# NOTE ON FILE STRUCTURE: a Maestro flow file is exactly two YAML documents —
# the config header, then one flow. Any further `---` sections are silently
# ignored. This file previously held four scenarios separated by `---` and only
# this first one ever ran, so it reported green while testing a quarter of what
# it claimed. The other three now live in their own files:
#   log-screen-tab-tap-returns-home.yaml
#   log-screen-sequential-types.yaml
#   log-screen-form-state-reset.yaml
# Do not re-merge them.
appId: com.haven.app
---
- launchApp
- assertVisible: "Replenish"        # on Tend home

- tapOn: "Replenish"
- assertVisible: "How much water did you take in?"

- back                              # swipe back to Tend
- assertVisible: "Replenish"        # tile visible — on Tend home

- tapOn: "Trace"
- assertVisible: "Trace"

- back                              # should stay on Tend, not return to log screen
- assertVisible: "Replenish"        # tile visible — on Tend home, NOT on log screen
