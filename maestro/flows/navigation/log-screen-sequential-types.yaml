# Scenario: sequential multi-type log — open A, back, open B, back; land on Tend
# each time rather than on the previously dismissed log screen.
# Split out of log-screen-back-navigation.yaml — see the note in that file.
appId: com.haven.app
---
- launchApp
- assertVisible: "Replenish"

- tapOn: "Replenish"
- assertVisible: "How much water did you take in?"

- back
- assertVisible: "Replenish"        # on Tend home after first back

- tapOn: "Journey"
- assertVisible: "What have you been about?"

# The Activity screen's SearchBar autoFocuses, so the keyboard is up. A `back`
# press with the keyboard showing only dismisses the keyboard — it does not
# navigate — so the assertion below would still be on the log screen.
- hideKeyboard
- back
- assertVisible: "Journey"          # tile visible — on Tend home after second back
- assertNotVisible: "What have you been about?"
