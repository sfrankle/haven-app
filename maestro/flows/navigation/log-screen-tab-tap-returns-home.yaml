# Scenario: tapping the Tend tab while on a log screen returns to Tend home
# Split out of log-screen-back-navigation.yaml — see the note in that file for
# why these cannot share one file.
appId: com.haven.app
---
- launchApp
- assertVisible: "Replenish"

- tapOn: "Replenish"
- assertVisible: "How much water did you take in?"

- tapOn:
    id: "tab-tend"
- assertVisible: "Replenish"        # tile visible — on Tend home
- assertNotVisible: "How much water did you take in?"
