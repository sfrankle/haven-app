# Scenario: Tapping Tier-2 in the left column replaces the chip
#
# Split out of log-emotion.yaml — see the note at the top of that file.
appId: com.haven.app
---
- launchApp
- tapOn: "Unveil"
- tapOn:
    id: "emotion-tier1-.*"
- tapOn:
    id: "emotion-tier2-right-.*"       # arrives at Screen 3 with chip set (Tier-2 label)
- tapOn:
    id: "emotion-tier3-right-.*"       # select Tier-3, chip now shows Tier-3 label
- assertVisible:
    id: "emotion-chip"
- tapOn:
    id: "emotion-tier2-left-.*"        # tap Tier-2 in left column — chip should update to Tier-2
- assertVisible:
    id: "emotion-chip"                # chip updated to the tapped Tier-2 label
- assertVisible:
    id: "emotion-save-button"         # save still available
