# Scenario: save from Screen 3
# Tap Unveil tile → Tier-1 → pivot Tier-1 → Tier-2 (advances to Screen 3) → submit
#
# NOTE ON FILE STRUCTURE: a Maestro flow file is exactly two YAML documents —
# the config header, then one flow. Any further `---` sections are silently
# ignored. This file previously held six scenarios separated by `---` and only
# this first one ever ran, so it reported green while testing a sixth of what it
# claimed — and the Emotion screen's chip-replacement model is the most
# intricate interaction in the app. The other five now live in their own files:
#   log-emotion-tier2-save.yaml
#   log-emotion-tier3-replace.yaml
#   log-emotion-chip-clear-reselect.yaml
#   log-emotion-tier2-left-replace.yaml
#   log-emotion-back-navigation.yaml
# Do not re-merge them.
appId: com.haven.app
---
- launchApp
- assertVisible: "Unveil"             # tile on Tend
- tapOn: "Unveil"
- assertVisible:
    id: "emotion-screen-1"
- tapOn:
    id: "emotion-tier1-.*"             # tap first Tier-1 row
- assertVisible:
    id: "emotion-screen-2"
- tapOn:
    id: "emotion-tier1-left-.*"        # pivot left column to another Tier-1
- assertVisible:
    id: "emotion-tier2-right-.*"       # Tier-2 children load
- tapOn:
    id: "emotion-tier2-right-.*"       # tap Tier-2 — pushes to Screen 3
- assertVisible:
    id: "emotion-screen-3"
- assertVisible:
    id: "emotion-chip"                # chip shows the Tier-2 label
- assertVisible:
    id: "emotion-save-button"
- tapOn:
    id: "emotion-save-button"
- assertVisible:
    id: "tile-food"        # back on Tend home — save succeeded
