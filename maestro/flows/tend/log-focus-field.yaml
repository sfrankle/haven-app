appId: com.haven.app
---
- launchApp
- assertVisible: "Nourish"
- tapOn: "Nourish"
- assertVisible:
    id: "food-search"
- tapOn:
    id: "food-search"
- inputText: "Oats"
- assertVisible:
    id: "food-suggestion-*"
- tapOn: "Oats"
- assertVisible:
    id: "food-chip-*"
# Expand focus field
- tapOn:
    id: "focus-toggle"
# If focuses exist, tap the first one
- assertVisible:
    id: "focus-new"
- assertVisible:
    id: "food-save-button"
- tapOn:
    id: "food-save-button"
- assertVisible: "Entry saved."
