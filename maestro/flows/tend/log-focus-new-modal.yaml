appId: com.haven.app
---
# clearState is required, not incidental: log-focus-field.yaml also creates a
# focus named "Digestion" and sorts earlier, so without a reset this flow hits
# the duplicate-name error and the modal never closes. It passes standalone and
# fails in a full sweep — the worst kind of flow to leave coupled.
- launchApp:
    clearState: true
- assertVisible: "Nourish"
- tapOn: "Nourish"
- assertVisible:
    id: "food-search"
- tapOn:
    id: "food-search"
- inputText: "Eggs"
- assertVisible:
    id: "food-suggestion-.*"
- tapOn:
    id: "food-suggestion-.*"
- assertVisible:
    id: "food-chip-.*"
# Open focus dropdown
- tapOn:
    id: "focus-toggle"
- assertVisible:
    id: "focus-new"
# Open the new focus modal
- tapOn:
    id: "focus-new"
- assertVisible:
    id: "focus-new-modal"
- tapOn:
    id: "focus-new-name-input"
- inputText: "Digestion"
- hideKeyboard                # keyboard otherwise covers the modal submit
- tapOn:
    id: "focus-new-submit"
# Modal should close; new focus name should appear as selected in toggle
- assertNotVisible:
    id: "focus-new-modal"
# Save the entry
- hideKeyboard                # keyboard otherwise covers the save button
- assertVisible:
    id: "food-save-button"
- tapOn:
    id: "food-save-button"
- assertVisible:
    id: "tile-food"        # back on Tend home — save succeeded
