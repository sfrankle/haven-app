appId: com.haven.app
---
- launchApp:
    clearState: true          # "Today: 0 oz" only holds on a fresh day
- assertVisible: "Replenish"
- tapOn: "Replenish"
- assertVisible: "How much water did you take in?"
- assertVisible: "Today: 0 oz"
- tapOn:
    id: "hydration-oz-input"
- eraseText
- inputText: "24"
- assertVisible:
    id: "hydration-save-button"
- tapOn:
    id: "hydration-save-button"
- assertVisible:
    id: "tile-food"        # back on Tend home — save succeeded

# Re-enter to check the running total persisted. Asserting it straight after
# the save tap races the confirmation dismiss, which leaves this screen.
- tapOn: "Replenish"
- assertVisible: "Today: 24 oz"
