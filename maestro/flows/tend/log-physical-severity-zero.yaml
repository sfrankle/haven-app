appId: com.haven.app
---
- launchApp
- assertVisible: "Attune"
- tapOn: "Attune"
- assertVisible:
    id: "energy-slider"
- assertVisible:
    id: "physical-search"
# Search for and select a sensation
- tapOn:
    id: "physical-search"
- inputText: "Cramp"
- assertVisible:
    id: "physical-suggestion-.*"
- tapOn:
    id: "physical-suggestion-.*"
# SeverityRow should appear after selecting a chip
- assertVisible:
    id: "physical-severity-row"
# Tap severity 0 (absent)
- tapOn:
    text: "0"
    id: "physical-severity-row"
# Chip label should show "(absent)"
- assertVisible:
    text: ".*absent.*"
# Save
- tapOn:
    id: "physical-save-button"
- assertVisible:
    id: "tile-food"        # back on Tend home — save succeeded
