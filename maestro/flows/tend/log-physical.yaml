appId: com.haven.app
---
- launchApp
- assertVisible: "Attune"          # tile on Tend
- tapOn: "Attune"
- assertVisible:
    id: "energy-slider"
- assertVisible:
    id: "physical-search"
# Set energy. The level labels under the slider are decorative Text with no
# press handler (EnergySlider.tsx) — dragging the Slider is the only way to set
# a value, per docs/design/wireframes/v1/Tend-page-physical.md. A RIGHT swipe
# saturates at the maximum, so the resulting value is deterministic.
- swipe:
    from:
      id: "energy-slider"
    direction: RIGHT
# Energy chip added, carrying the value the swipe produced. Anchored to the
# chip's testID so this asserts the chip's own content, not a loose page match.
- assertVisible:
    id: "physical-chip-energy"
    text: "Energy: 5/5"
# SearchBar autoFocuses on mount, so the keyboard is up on arrival and covers
# the lower third of the form, including the save button.
- hideKeyboard
- assertVisible:
    id: "physical-save-button"
# Search for a state
- tapOn:
    id: "physical-search"
- inputText: "Cramp"
- assertVisible:
    id: "physical-suggestion-.*"    # at least one result
- tapOn:
    id: "physical-suggestion-.*"
- assertVisible:
    id: "physical-chip-.*"          # state chip added with area prefix
# Save — the keyboard is up again after typing into the search field.
- hideKeyboard
- tapOn:
    id: "physical-save-button"
- assertVisible:
    id: "tile-food"        # back on Tend home — save succeeded
