appId: com.haven.app
---
- launchApp
- assertVisible: "Attune"          # tile on Tend
- tapOn: "Attune"
- assertVisible:
    id: "energy-slider"
- assertVisible:
    id: "physical-search"
# Set energy by tapping the topmost level label. The labels are now pressable
# (EnergySlider.tsx), which is both a larger target than the slider thumb and
# exact — a swipe only saturates at the maximum by luck of gesture distance.
- tapOn: "Energised"
# Energy chip added, carrying the tapped level. Anchored to the chip's testID so
# this asserts the chip's own content, not a loose page match.
- assertVisible:
    id: "physical-chip-energy"
    text: "Energy: 5/5"
# No hideKeyboard here: this screen deliberately does not autofocus its search
# box, so no keyboard is up on arrival and the save button is already visible.
# An unnecessary hideKeyboard is an Android back press and would pop the screen.
- assertVisible:
    id: "physical-save-button"
# Search for a state
- tapOn:
    id: "physical-search"
- inputText: "Cramp"
- assertVisible:
    id: "physical-suggestion-.*"    # at least one result
- tapOn:
    id: "physical-suggestion-.*"
- assertVisible:
    id: "physical-chip-.*"          # state chip added with area prefix
# Save — the keyboard is up again after typing into the search field.
- hideKeyboard
- tapOn:
    id: "physical-save-button"
- assertVisible:
    id: "tile-food"        # back on Tend home — save succeeded
