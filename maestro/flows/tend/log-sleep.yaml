appId: com.haven.app
---
- launchApp
- assertVisible: "Slumber"
- tapOn: "Slumber"
- assertVisible: "How long did you rest?"
- tapOn:
    id: "sleep-hours-input"
- inputText: "7"
- assertVisible:
    id: "sleep-save-button"
- tapOn:
    id: "sleep-save-button"
- assertVisible:
    id: "tile-food"        # back on Tend home — save succeeded

# Notes field is visible before saving
- launchApp
- assertVisible: "Slumber"
- tapOn: "Slumber"
- tapOn:
    id: "sleep-hours-input"
- inputText: "8"
- assertVisible:
    id: "sleep-notes-input"
- tapOn:
    id: "sleep-notes-input"
- inputText: "slept well"
- tapOn:
    id: "sleep-save-button"
- assertVisible:
    id: "tile-food"        # back on Tend home — save succeeded
