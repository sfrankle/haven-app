# Routine complete E2E flow
#
# Exercises the Complete Routine screen reached by tapping a Routine card on the
# Tend dashboard. The Routine is created explicitly by the shared subflow rather
# than assuming one already exists, so this flow is self-contained.
#
# Related flows: maestro/flows/tend/routine-create-edit.yaml (create and edit)
#                maestro/flows/tend/routine-dashboard.yaml   (section states)
appId: com.haven.app
---
- launchApp:
    clearState: true

- tapOn: "Tend"

# --- Create the Routine to complete (first routine after clearState, so id 1) ---
# Morning block keeps this time-of-day stable — the card is due-now from 05:00
# onwards. See the note in the shared subflow.
- runFlow: ../../subflows/create-morning-routine.yaml

# --- Open the complete flow from the Routine card ---
- tapOn:
    id: "routine-card-1"

# Items load checked by default
- assertVisible:
    id: "routine-complete-item-0-checkbox"

# Add shared notes
- tapOn:
    id: "routine-complete-notes-input"
- inputText: "Felt steady today"
- hideKeyboard

# Submit. The "Saved." confirmation is deliberately not asserted: complete.tsx
# calls router.back() 800ms after showing it, and Maestro's post-tap latency on
# an emulator ranges 2–12s, so the assertion races an animation it usually
# loses. The durable outcome below proves the save instead — navigation only
# happens on the success path.
- tapOn:
    id: "routine-complete-submit-button"

# Returns to Tend, where the completed Routine has moved behind the disclosure row
- assertVisible:
    id: "routine-section-disclosure"
- assertNotVisible:
    id: "routine-complete-submit-button"

# --- Unchecking an item skips it: complete a second time with the item off ---
- tapOn:
    id: "routine-section-disclosure"
- tapOn:
    id: "routine-collapsed-row-1"
- tapOn:
    id: "routine-complete-item-0-checkbox"
- tapOn:
    id: "routine-complete-submit-button"

# Same durable-outcome assertion as above rather than the transient "Saved."
- assertVisible:
    id: "routine-section-disclosure"
- assertNotVisible:
    id: "routine-complete-submit-button"
