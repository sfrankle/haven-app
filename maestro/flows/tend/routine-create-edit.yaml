# Routine create/edit E2E flow
#
# Creates a Routine from the Tend dashboard's "+ Add Routine" row, then edits it
# via Settings → Routines (the ⚙ icon), which is the canonical edit surface.
# Tapping a Routine card on Tend opens the *complete* flow, not edit — see
# maestro/flows/tend/routine-complete.yaml.
#
# Related flow: maestro/flows/tend/routine-dashboard.yaml (section states)
appId: com.haven.app
---
- launchApp:
    clearState: true

- tapOn:
    id: "tend-tab"

# --- Create a new Routine from the Tend dashboard ---
- tapOn:
    id: "routine-section-add-button"

- assertVisible:
    id: "routine-name-input"
- tapOn:
    id: "routine-name-input"
- inputText: "Morning Flow"

# Morning keeps the dashboard assertions below time-of-day stable: a Morning
# block has always started by any waking hour, so the Routine groups as due-now
# rather than sliding behind the "Later" disclosure row.
- tapOn:
    id: "routine-time-block-Morning"

# Add first item
- tapOn:
    id: "routine-add-item-button"
- tapOn:
    id: "routine-item-0-name-input"
- inputText: "Breakfast"
- tapOn:
    id: "routine-item-0-entry-type-1"   # Food

# Add second item
- tapOn:
    id: "routine-add-item-button"
- tapOn:
    id: "routine-item-1-name-input"
- inputText: "Morning walk"
- tapOn:
    id: "routine-item-1-entry-type-6"   # Activity

# Save
- tapOn:
    id: "routine-save-button"

# --- The new Routine appears on the Tend dashboard ---
- assertVisible:
    id: "routine-card-1"
- assertVisible: "Morning Flow"

# --- Edit the Routine via Settings → Routines ---
- tapOn: "Settings"
- assertVisible: "Routines"
- tapOn:
    id: "settings-routine-edit-1"

- assertVisible:
    id: "routine-edit-name-input"
- clearText:
    id: "routine-edit-name-input"
- inputText: "Updated Morning Flow"
- tapOn:
    id: "routine-edit-save-button"

# --- The updated name is reflected back on Tend ---
- tapOn:
    id: "tend-tab"
- assertVisible: "Updated Morning Flow"
