# Routine create/edit E2E flow
#
# Creates a Routine from the Tend dashboard's "+ Add Routine" row, then edits it
# via Settings → Routines (the ⚙ icon), which is the canonical edit surface.
# Tapping a Routine card on Tend opens the *complete* flow, not edit — see
# maestro/flows/tend/routine-complete.yaml.
#
# Related flow: maestro/flows/tend/routine-dashboard.yaml (section states)
appId: com.haven.app
---
- launchApp:
    clearState: true

- tapOn: "Tend"

# --- Create a new Routine from the Tend dashboard ---
# Shared with the other Routine flows; see the subflow for why the block is
# Morning and why that keeps the assertions below time-of-day stable.
- runFlow: ../../subflows/create-morning-routine.yaml

# --- The new Routine appears on the Tend dashboard ---
- assertVisible:
    id: "routine-card-1"
- assertVisible: "Morning Flow"

# --- Edit the Routine via Settings → Routines ---
- tapOn: "Settings"
- assertVisible: "Routines"
- tapOn:
    id: "settings-routine-edit-1"

- assertVisible:
    id: "routine-edit-name-input"
- tapOn:
    id: "routine-edit-name-input"
- eraseText
- inputText: "Updated Morning Flow"
# The keyboard covers the lower half of the form and swallows taps aimed at
# anything beneath it. See maestro/subflows/create-morning-routine.yaml.
- hideKeyboard

# COVERAGE GAP — adding a second item on the edit screen is not covered here,
# and cannot be until #195 is fixed. Two items make the form taller than the
# viewport, and logScreenStyles.screenContent sets flex: 1 on the ScrollView's
# contentContainerStyle, which disables scrolling outright. The save button is
# then unreachable by any means: scrollUntilVisible scrolls zero pixels. This
# is a real app defect, not a flow problem — a user cannot save a two-item
# Routine from this screen either. Restore the add-item steps when #195 lands.

- tapOn:
    id: "routine-edit-save-button"

# --- The updated name is reflected back on Tend ---
- tapOn: "Tend"
- assertVisible: "Updated Morning Flow"
