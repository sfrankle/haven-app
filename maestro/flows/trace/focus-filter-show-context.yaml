appId: com.haven.app
name: Trace — focus filter show context (context view mode)
---
# Pre-condition: create a focus, log a food entry linked to it, and log a
# sleep entry in the same time window (to appear as context). Then verify
# the Show context / dismiss flow works with the context view mode.
# Context view replaces the filtered SectionList with a flat list showing
# all entries around the focal entry. Non-focus entries are muted; the
# focal entry has a glow left border.
- launchApp:
    clearState: true

# Create a Focus via the Tend add-focus pill
- tapOn:
    id: "add-focus-pill"
- tapOn:
    id: "focus-name-input"
- inputText: "Context Test Focus"
- tapOn:
    id: "focus-save-button"
- assertVisible: "Context Test Focus"

# Log a Food entry linked to the focus
- tapOn:
    id: "tile-food"
- tapOn:
    text: "Oats"
- tapOn:
    id: "focus-toggle"
- tapOn:
    text: "Context Test Focus"
- tapOn:
    id: "food-save-button"
- assertVisible:
    id: "tile-food"        # back on Tend home — save succeeded

# Log a Sleep entry in the same session (no focus link — will appear as context)
- tapOn:
    id: "tile-sleep"
- tapOn:
    id: "sleep-hours-input"
- inputText: "7"
- tapOn:
    id: "sleep-save-button"
- assertVisible:
    id: "tile-food"        # back on Tend home — save succeeded

# Navigate to Trace
- tapOn:
    id: "tab-trace"

# Activate the Focus filter pill
- assertVisible:
    id: "focus-filter-row"
- tapOn:
    text: "Context Test Focus"

# The food entry should be visible; the sleep entry should be filtered out
- assertVisible: "Ate Oats"

# Tap Show context — this switches to context view mode
- tapOn:
    id: "show-context-1"

# Context view is now visible (replaces the filtered SectionList)
- assertVisible:
    id: "context-view"

# Dismiss button is visible
- assertVisible:
    id: "context-view-dismiss"

# Tap dismiss — returns to the filtered SectionList
- tapOn:
    id: "context-view-dismiss"

# Context view is gone; filtered list is restored
- assertNotVisible:
    id: "context-view"

# The food entry should be visible again in the filtered list
- assertVisible: "Ate Oats"
